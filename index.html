<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ AI Prompt Different</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
    min-height: 100vh;
    padding: 20px;
    background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
  }
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  header { text-align: center; padding: 40px 10px 20px; }
  header h1 {
    font-size: 2.5rem;
    background: linear-gradient(90deg, #f9d423, #ff4e50, #f9d423);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }
  header p { color: #aaa; margin-top: 10px; }
  .telegram-btn {
    display: inline-block;
    margin-top: 20px;
    background: linear-gradient(90deg, #0088cc, #00bfff);
    color: #fff;
    padding: 12px 30px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
    box-shadow: 0 4px 20px rgba(0,136,204,0.5);
  }
  .admin-btn {
    display: inline-block;
    margin-top: 15px;
    margin-left: 10px;
    background: linear-gradient(90deg, #f9d423, #ff4e50);
    color: #000;
    padding: 10px 24px;
    border-radius: 30px;
    border: none;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .upload-box {
    max-width: 700px;
    margin: 20px auto;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 30px;
    backdrop-filter: blur(15px);
    display: none;
  }
  .upload-box.active { display: block; }
  .upload-box label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #f9d423;
  }
  .upload-box input, .upload-box textarea, .upload-box select {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.4);
    color: #fff;
    margin-bottom: 15px;
    font-size: 1rem;
  }
  .upload-box textarea { min-height: 120px; }
  #preview { max-width: 100%; border-radius: 12px; margin-bottom: 15px; display: none; }
  .btn-main {
    background: linear-gradient(90deg, #f9d423, #ff4e50);
    color: #000;
    font-weight: bold;
    border: none;
    padding: 14px 35px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 1rem;
    width: 100%;
  }
  .btn-main:disabled { opacity: 0.6; }
  .logout-btn {
    background: linear-gradient(90deg, #ff4e50, #f9d423);
    color: #000;
    border: none;
    padding: 8px 20px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
    font-size: 0.85rem;
  }
  .gallery {
    max-width: 1200px;
    margin: 50px auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 25px;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .card img { width: 100%; height: 300px; object-fit: cover; }
  .card-content { padding: 15px; }
  .card-content h3 { color: #f9d423; font-size: 1rem; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .card-content p { font-size: 0.9rem; color: #ccc; line-height: 1.5; max-height: 120px; overflow-y: auto; }
  .copy-btn {
    background: linear-gradient(90deg, #00c9ff, #92fe9d);
    color: #000;
    border: none;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: bold;
    cursor: pointer;
  }
  .contact {
    max-width: 700px;
    margin: 60px auto 30px;
    text-align: center;
    padding: 30px;
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .contact h2 { color: #f9d423; margin-bottom: 15px; }
  .contact p { color: #ccc; margin-bottom: 12px; }
  .contact a { color: #ff4e50; text-decoration: none; font-weight: bold; }
  .contact .email-btn {
    display: inline-block;
    margin-top: 10px;
    background: linear-gradient(90deg, #ea4335, #fbbc05);
    color: #fff;
    padding: 12px 30px;
    border-radius: 25px;
    text-decoration: none;
    font-weight: bold;
  }
  .contact .tg-link {
    display: inline-block;
    margin-top: 10px;
    background: linear-gradient(90deg, #0088cc, #00bfff);
    color: #fff;
    padding: 12px 30px;
    border-radius: 25px;
    text-decoration: none;
    font-weight: bold;
  }
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: linear-gradient(90deg, #00c9ff, #92fe9d);
    color: #000;
    padding: 14px 28px;
    border-radius: 30px;
    font-weight: bold;
    transition: transform 0.4s;
    z-index: 10000;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .loading { text-align: center; color: #f9d423; padding: 40px; grid-column: 1/-1; }
  .empty { text-align: center; color: #888; padding: 60px 20px; grid-column: 1/-1; }
</style>
</head>
<body>

<header>
  <h1>✨ AI Prompt Different</h1>
  <p>Apni photo aur prompt upload karein</p>
  <a href="https://t.me/AiPromptdifferent" target="_blank" class="telegram-btn">
    ✈️ Join Telegram Channel
  </a>
  <button class="admin-btn" id="adminBtn">🔐 Admin Login</button>
</header>

<div class="upload-box" id="uploadBox">
  <label>📷 Photo Upload Karein</label>
  <input type="file" id="imageInput" accept="image/*">
  <img id="preview" alt="preview">

  <label>📝 AI Prompt Likhein</label>
  <textarea id="promptInput" placeholder="Yahan apna prompt likhein..."></textarea>

  <label>🏷️ Category Chunein</label>
  <select id="categoryInput">
    <option value="Fantasy">Fantasy</option>
    <option value="Portrait">Portrait</option>
    <option value="Nature">Nature</option>
    <option value="Sci-Fi">Sci-Fi</option>
    <option value="Anime">Anime</option>
    <option value="Other">Other</option>
  </select>

  <button class="btn-main" id="uploadBtn">🚀 Upload Karein</button>
  <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
</div>

<div class="gallery" id="gallery">
  <div class="loading" id="loading">⏳ Gallery load ho rahi hai...</div>
</div>

<div class="contact">
  <h2>📞 Contact Karein</h2>
  <p>Koi bhi sawaal, suggestion, ya content ke liye contact karein:</p>
  <a href="mailto:alexushshshs@gmail.com" class="email-btn">
    📧 alexushshshs@gmail.com
  </a>
  <p style="margin-top:20px;">Telegram Channel Join Karein:</p>
  <a href="https://t.me/AiPromptdifferent" target="_blank" class="tg-link">
    ✈️ @AiPromptdifferent
  </a>
</div>

<div class="toast" id="toast">✅ Copied!</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBPvoo4ro_ZcTb8b4R0hjSpkmIFdwZ8R3A",
    authDomain: "ai-prompt-vault-e81ab.firebaseapp.com",
    projectId: "ai-prompt-vault-e81ab",
    storageBucket: "ai-prompt-vault-e81ab.firebasestorage.app",
    messagingSenderId: "191570252019",
    appId: "1:191570252019:web:c9c8277ee0517496e5a786",
    measurementId: "G-GC13MY4WJ4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 🔐 ADMIN PASSWORD
  const ADMIN_PASSWORD = "New_alfez";

  const gallery = document.getElementById('gallery');
  const imageInput = document.getElementById('imageInput');
  const promptInput = document.getElementById('promptInput');
  const categoryInput = document.getElementById('categoryInput');
  const preview = document.getElementById('preview');
  const uploadBtn = document.getElementById('uploadBtn');
  const uploadBox = document.getElementById('uploadBox');
  const adminBtn = document.getElementById('adminBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  let currentImage = '';

  function checkAdmin() {
    if (localStorage.getItem('isAdmin') === 'true') {
      uploadBox.classList.add('active');
      adminBtn.textContent = '✅ Admin Logged In';
      adminBtn.style.background = 'linear-gradient(90deg, #00c9ff, #92fe9d)';
    }
  }

  adminBtn.addEventListener('click', function() {
    if (localStorage.getItem('isAdmin') === 'true') {
      showToast('✅ Aap pehle se logged in hain!');
      return;
    }
    const pass = prompt('🔐 Admin Password Daalein:');
    if (pass === ADMIN_PASSWORD) {
      localStorage.setItem('isAdmin', 'true');
      uploadBox.classList.add('active');
      adminBtn.textContent = '✅ Admin Logged In';
      adminBtn.style.background = 'linear-gradient(90deg, #00c9ff, #92fe9d)';
      showToast('🎉 Welcome Admin!');
    } else if (pass !== null) {
      showToast('❌ Galat Password!');
    }
  });

  logoutBtn.addEventListener('click', function() {
    localStorage.removeItem('isAdmin');
    uploadBox.classList.remove('active');
    adminBtn.textContent = '🔐 Admin Login';
    adminBtn.style.background = 'linear-gradient(90deg, #f9d423, #ff4e50)';
    showToast('🚪 Logout ho gaya!');
  });

  checkAdmin();

  imageInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(ev) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const maxSize = 1000;

        if (width > height && width > maxSize) {
          height = (height * maxSize) / width;
          width = maxSize;
        } else if (height > maxSize) {
          width = (width * maxSize) / height;
          height = maxSize;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        currentImage = canvas.toDataURL('image/jpeg', 0.7);
        preview.src = currentImage;
        preview.style.display = 'block';
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  function createCard(img, prompt, category) {
    const card = document.createElement('div');
    card.className = 'card';
    const safePrompt = prompt.replace(/"/g, '&quot;').replace(/'/g, "\\'");
    card.innerHTML = `
      <img src="${img}" alt="AI Art">
      <div class="card-content">
        <h3>
          <span>🏷️ ${category}</span>
          <button class="copy-btn" onclick="copyPrompt(this, '${safePrompt}')">📋 Copy</button>
        </h3>
        <p>${prompt}</p>
      </div>
    `;
    return card;
  }

  uploadBtn.addEventListener('click', async function() {
    if (localStorage.getItem('isAdmin') !== 'true') {
      showToast('❌ Pehle Admin Login karein!');
      return;
    }

    const prompt = promptInput.value.trim();
    const category = categoryInput.value;

    if (!currentImage) {
      showToast('⚠️ Photo upload karein!');
      return;
    }
    if (!prompt) {
      showToast('⚠️ Prompt likhein!');
      return;
    }

    uploadBtn.disabled = true;
    uploadBtn.textContent = '⏳ Upload ho raha hai...';

    try {
      await addDoc(collection(db, 'prompts'), {
        image: currentImage,
        prompt: prompt,
        category: category,
        createdAt: serverTimestamp()
      });

      gallery.prepend(createCard(currentImage, prompt, category));
      currentImage = '';
      preview.style.display = 'none';
      imageInput.value = '';
      promptInput.value = '';
      showToast('🎉 Upload successful!');
    } catch (error) {
      console.error(error);
      showToast('❌ Error: ' + error.message);
    }

    uploadBtn.disabled = false;
    uploadBtn.textContent = '🚀 Upload Karein';
  });

  async function loadCards() {
    try {
      const q = query(collection(db, 'prompts'), orderBy('createdAt', 'desc'));
      const snapshot = await getDocs(q);
      const loading = document.getElementById('loading');
      if (loading) loading.remove();

      if (snapshot.empty) {
        gallery.innerHTML = '<div class="empty">📭 Abhi koi prompt upload nahi hua. Pehla upload aap karein!</div>';
        return;
      }

      gallery.innerHTML = '';
      snapshot.forEach(doc => {
        const data = doc.data();
        gallery.appendChild(createCard(data.image, data.prompt, data.category));
      });
    } catch (error) {
      console.error(error);
      gallery.innerHTML = '<div class="empty">❌ Gallery load nahi hui: ' + error.message + '</div>';
    }
  }

  window.copyPrompt = function(btn, text) {
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = '✅ Copied!';
      showToast('📋 Prompt copied!');
      setTimeout(() => btn.textContent = '📋 Copy', 1500);
    });
  };

  const toast = document.getElementById('toast');
  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
  }

  loadCards();
</script>

</body>
                                                                    </html>
