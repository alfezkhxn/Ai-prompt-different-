<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ AI Prompt Vault</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
    min-height: 100vh;
    padding: 20px;
    background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    overflow-x: hidden;
  }
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  header { text-align: center; padding: 40px 10px 20px; }
  header h1 {
    font-size: 2.5rem;
    background: linear-gradient(90deg, #f9d423, #ff4e50, #f9d423);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }
  header p { color: #aaa; margin-top: 10px; }
  .telegram-btn {
    display: inline-block;
    margin-top: 20px;
    background: linear-gradient(90deg, #0088cc, #00bfff);
    color: #fff;
    padding: 12px 30px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
    box-shadow: 0 4px 20px rgba(0,136,204,0.5);
  }
  .upload-box {
    max-width: 700px;
    margin: 20px auto;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 30px;
    backdrop-filter: blur(15px);
  }
  .upload-box label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #f9d423;
  }
  .upload-box input[type="file"],
  .upload-box textarea,
  .upload-box select {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.4);
    color: #fff;
    margin-bottom: 15px;
    font-size: 1rem;
  }
  .upload-box textarea { min-height: 120px; resize: vertical; }
  #preview {
    max-width: 100%;
    border-radius: 12px;
    margin-bottom: 15px;
    display: none;
  }
  .btn-main {
    background: linear-gradient(90deg, #f9d423, #ff4e50);
    color: #000;
    font-weight: bold;
    border: none;
    padding: 14px 35px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 1rem;
    width: 100%;
  }
  .gallery {
    max-width: 1200px;
    margin: 50px auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 25px;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.15);
    transition: transform 0.3s;
  }
  .card:hover { transform: translateY(-8px); }
  .card img { width: 100%; height: 300px; object-fit: cover; }
  .card-content { padding: 15px; }
  .card-content h3 {
    color: #f9d423;
    font-size: 1rem;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-content p {
    font-size: 0.9rem;
    color: #ccc;
    line-height: 1.5;
    max-height: 120px;
    overflow-y: auto;
  }
  .copy-btn {
    background: linear-gradient(90deg, #00c9ff, #92fe9d);
    color: #000;
    border: none;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: bold;
    cursor: pointer;
  }
  .contact {
    max-width: 700px;
    margin: 60px auto 30px;
    text-align: center;
    padding: 30px;
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .contact h2 { color: #f9d423; margin-bottom: 15px; }
  .contact a { color: #ff4e50; text-decoration: none; font-weight: bold; }
  .contact .tg-link {
    display: inline-block;
    margin-top: 10px;
    background: linear-gradient(90deg, #0088cc, #00bfff);
    color: #fff;
    padding: 10px 24px;
    border-radius: 25px;
    text-decoration: none;
  }
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: linear-gradient(90deg, #00c9ff, #92fe9d);
    color: #000;
    padding: 14px 28px;
    border-radius: 30px;
    font-weight: bold;
    transition: transform 0.4s;
    z-index: 10000;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>✨ AI Prompt Vault</h1>
  <p>Apni photo aur prompt upload karein</p>
  <a href="https://t.me/AiPromptdifferent" target="_blank" class="telegram-btn">
    ✈️ Join Telegram Channel
  </a>
</header>

<div class="upload-box">
  <label>📷 Photo Upload Karein</label>
  <input type="file" id="imageInput" accept="image/*">
  <img id="preview" alt="preview">

  <label>📝 AI Prompt Likhein</label>
  <textarea id="promptInput" placeholder="Yahan apna prompt likhein..."></textarea>

  <label>🏷️ Category Chunein</label>
  <select id="categoryInput">
    <option value="Fantasy">Fantasy</option>
    <option value="Portrait">Portrait</option>
    <option value="Nature">Nature</option>
    <option value="Sci-Fi">Sci-Fi</option>
    <option value="Anime">Anime</option>
    <option value="Other">Other</option>
  </select>

  <button class="btn-main" onclick="addCard()">🚀 Upload Karein</button>
</div>

<div class="gallery" id="gallery"></div>

<div class="contact">
  <h2>📞 Contact</h2>
  <p>Email: <a href="mailto:aapka@email.com">aapka@email.com</a></p>
  <p style="margin-top:15px;">Telegram Channel:</p>
  <a href="https://t.me/AiPromptdifferent" target="_blank" class="tg-link">
    ✈️ @AiPromptdifferent
  </a>
</div>

<div class="toast" id="toast">✅ Copied!</div>

<script>
  const gallery = document.getElementById('gallery');
  const imageInput = document.getElementById('imageInput');
  const promptInput = document.getElementById('promptInput');
  const categoryInput = document.getElementById('categoryInput');
  const preview = document.getElementById('preview');
  let currentImage = '';

  imageInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = ev => {
        currentImage = ev.target.result;
        preview.src = currentImage;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }
  });

  function createCard(img, prompt, category) {
    const card = document.createElement('div');
    card.className = 'card';
    const safePrompt = prompt.replace(/"/g, '&quot;').replace(/'/g, "\\'");
    card.innerHTML = `
      <img src="${img}" alt="AI Art">
      <div class="card-content">
        <h3>
          <span>🏷️ ${category}</span>
          <button class="copy-btn" onclick="copyPrompt(this, '${safePrompt}')">📋 Copy</button>
        </h3>
        <p>${prompt}</p>
      </div>
    `;
    return card;
  }

  function addCard() {
    const prompt = promptInput.value.trim();
    const category = categoryInput.value;
    if (!currentImage || !prompt) {
      showToast('⚠️ Photo aur prompt dono daalein!');
      return;
    }
    gallery.prepend(createCard(currentImage, prompt, category));
    saveCard(currentImage, prompt, category);
    currentImage = '';
    preview.style.display = 'none';
    imageInput.value = '';
    promptInput.value = '';
    showToast('🎉 Upload successful!');
  }

  function copyPrompt(btn, text) {
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = '✅ Copied!';
      showToast('📋 Prompt copied!');
      setTimeout(() => btn.textContent = '📋 Copy', 1500);
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('📋 Prompt copied!');
    });
  }

  const toast = document.getElementById('toast');
  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function saveCard(img, prompt, category) {
    let cards = JSON.parse(localStorage.getItem('aiCardsV3') || '[]');
    cards.unshift({ img, prompt, category });
    localStorage.setItem('aiCardsV3', JSON.stringify(cards));
  }
  function loadCards() {
    let cards = JSON.parse(localStorage.getItem('aiCardsV3') || '[]');
    cards.forEach(c => gallery.appendChild(createCard(c.img, c.prompt, c.category)));
  }
  loadCards();
</script>

</body>
  </html>
